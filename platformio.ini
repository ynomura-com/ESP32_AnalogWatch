[platformio]
default_envs = mhetesp32minikit

[env:mhetesp32minikit]
; Arduino-ESP32 core 2.0.x 系に固定(TFT_eSPI は core 3.x だと動作しないことがある)
platform = espressif32@6.9.0
board = mhetesp32minikit
framework = arduino

monitor_speed = 115200
monitor_filters = default, time

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI の設定は User_Setup.h を編集せず、ここで全部指定する
build_flags =
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=2
    -DTFT_SCLK=15
    -DTFT_CS=16
    -DTFT_DC=4
    -DTFT_RST=17
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    ; まずは控えめな速度(27000000)で動作確認。安定したら 40000000 に上げる
    -DSPI_FREQUENCY=40000000
    ; 色が赤↔青で入れ替わる場合は有効化
    ; -DTFT_RGB_ORDER=TFT_BGR
    ; Arduino-ESP32 の詳細ログが必要な場合は有効化
    ; -DCORE_DEBUG_LEVEL=3

; 鉄道時計風の文字盤(白)。この env を選んで書き込む
[env:railway]
extends = env:mhetesp32minikit
build_flags =
    ${env:mhetesp32minikit.build_flags}
    -DFACE_STYLE=1
