; ======================================================================
;  アナログ時計 (GC9A01 240x240 円形ディスプレイ)
;
;  使う環境 (env): ボード名_文字盤 の形式
;    supermini_blue             ESP32-C3 Super Mini / 青い文字盤   ← 既定
;    supermini_railway          ESP32-C3 Super Mini / 鉄道時計風の文字盤
;    xiao_c3_blue               Seeed XIAO ESP32C3 / 青い文字盤
;    xiao_c3_railway            Seeed XIAO ESP32C3 / 鉄道時計風の文字盤
;    esp32_2424s012_blue        ESP32-2424S012 (1.28" 円形LCD一体型) / 青い文字盤
;    esp32_2424s012_railway     ESP32-2424S012 / 鉄道時計風の文字盤
;    mhetesp32minikit_blue      ESP32 MiniKit (MH-ET LIVE) / 青い文字盤
;    mhetesp32minikit_railway   ESP32 MiniKit (MH-ET LIVE) / 鉄道時計風の文字盤
;
;  注意: コメントは行頭の ";" で書く ("//" は使えない)
; ======================================================================

[platformio]
default_envs = supermini_blue


; ======================================================================
;  ESP32-C3 Super Mini
;  配線: SDA=GPIO3, SCL=GPIO4, CS=GPIO1, DC=GPIO10, RST=GPIO0
;        VCC=3V3, GND=GND  (BL 端子は無いので接続不要)
; ======================================================================
[env:supermini_blue]
; TFT_eSPI は ESP32-C3 + Arduino-ESP32 core 2.0.15 以降で tft.init() が
; Store access fault になるため、core 2.0.14 相当(platform 6.5.0)に固定する
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = default, time

lib_deps =
    bodmer/TFT_eSPI@2.5.43

; 速度優先の最適化(既定の -Os の代わりに -O2)
build_unflags = -Os
build_flags =
    -O2
    ; ネイティブUSB(CDC)経由で Serial を使う
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI 設定 ---
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=4
    -DTFT_CS=1
    -DTFT_DC=10
    -DTFT_RST=0
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    ; SPI クロック。画面が乱れる場合は 27000000 に下げる
    -DSPI_FREQUENCY=40000000
    ; platform 6.5.0 でも tft.init() でクラッシュする場合は有効化
    ; -DUSE_HSPI_PORT
    ; 色が赤と青で入れ替わる場合は有効化
    ; -DTFT_RGB_ORDER=TFT_BGR
    ; Super Mini は送信出力を下げないと WiFi が AUTH_EXPIRE で接続できない個体が多い
    -DWIFI_LOW_TX_POWER

; ESP32-C3 Super Mini / 鉄道時計風の文字盤
[env:supermini_railway]
extends = env:supermini_blue
build_flags =
    ${env:supermini_blue.build_flags}
    -DFACE_STYLE=1


; ======================================================================
;  Seeed Studio XIAO ESP32C3
;  配線: SCL=D8(GPIO8), SDA=D10(GPIO10), CS=D0(GPIO2), DC=D1(GPIO3),
;        RST=D2(GPIO4), VCC=3V3, GND=GND  (BL 端子は無いので接続不要)
;  ※ WiFi を使うので、付属のアンテナを U.FL コネクタに取り付けること
; ======================================================================
[env:xiao_c3_blue]
; Super Mini と同じ ESP32-C3。TFT_eSPI のクラッシュ対策で platform 6.5.0 に固定
platform = espressif32@6.5.0
board = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
monitor_filters = default, time

lib_deps =
    bodmer/TFT_eSPI@2.5.43

; 速度優先の最適化(既定の -Os の代わりに -O2)
build_unflags = -Os
build_flags =
    -O2
    ; ネイティブUSB(CDC)経由で Serial を使う
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI 設定 ---
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=10
    -DTFT_SCLK=8
    -DTFT_CS=2
    -DTFT_DC=3
    -DTFT_RST=4
    ; 画面が反転する場合のみ有効化: 左右反転=TFT_FLIP_X / 上下反転=TFT_FLIP_Y(両方で180度回転)
    ; -DTFT_FLIP_X
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    ; SPI クロック。画面が乱れる場合は 27000000 に下げる
    -DSPI_FREQUENCY=40000000
    ; platform 6.5.0 でも tft.init() でクラッシュする場合は有効化
    ; -DUSE_HSPI_PORT
    ; 色が赤と青で入れ替わる場合は有効化
    ; -DTFT_RGB_ORDER=TFT_BGR
    ; WiFi が AUTH_EXPIRE でつながらない場合は有効化(送信出力を下げる)
    ; -DWIFI_LOW_TX_POWER

; XIAO ESP32C3 / 鉄道時計風の文字盤
[env:xiao_c3_railway]
extends = env:xiao_c3_blue
build_flags =
    ${env:xiao_c3_blue.build_flags}
    -DFACE_STYLE=1


; ======================================================================
;  ESP32-2424S012 (ESP32-C3-MINI-1U + GC9A01 1.28" 円形LCD 一体型ボード)
;  配線不要。ディスプレイは基板上で次のピンに接続済み:
;    SCLK=GPIO6, MOSI=GPIO7, CS=GPIO10, DC=GPIO2, RST=なし, BL=GPIO3
;  (タッチ CST816D: SDA=4, SCL=5, INT=0, RST=1 は使わない)
;  ※ WiFi を使うので、アンテナを U.FL コネクタに取り付けること
; ======================================================================
[env:esp32_2424s012_blue]
; ESP32-C3 なので TFT_eSPI のクラッシュ対策で platform 6.5.0 に固定
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = default, time

lib_deps =
    bodmer/TFT_eSPI@2.5.43

; 速度優先の最適化(既定の -Os の代わりに -O2)
build_unflags = -Os
build_flags =
    -O2
    ; ネイティブUSB(CDC)経由で Serial を使う
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI 設定 ---
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=10
    -DTFT_DC=2
    -DTFT_RST=-1
    ; 表示を右に90度回転(USB-C 端子が右側になる向きで使う)
    ; 向きが逆(USB-C が左になる)なら 3、基板上の標準の向き(USB-C が下)なら 0
    -DTFT_ROTATION=1
    ; バックライトは GPIO3(HIGH で点灯)
    -DTFT_BL=3
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    ; SPI クロック。画面が乱れる場合は 40000000 → 27000000 の順に下げる
    -DSPI_FREQUENCY=80000000
    ; platform 6.5.0 でも tft.init() でクラッシュする場合は有効化
    ; -DUSE_HSPI_PORT
    ; 色が赤と青で入れ替わる場合は有効化
    ; -DTFT_RGB_ORDER=TFT_BGR
    ; 白黒・色が反転している場合はどちらかを有効化
    ; -DTFT_INVERSION_ON
    ; -DTFT_INVERSION_OFF
    ; 画面が反転する場合のみ有効化: 左右反転=TFT_FLIP_X / 上下反転=TFT_FLIP_Y(両方で180度回転)
    ; -DTFT_FLIP_X
    ; WiFi が AUTH_EXPIRE でつながらない場合は有効化(送信出力を下げる)
    ; -DWIFI_LOW_TX_POWER

; ESP32-2424S012 / 鉄道時計風の文字盤(秒針は58.5秒で1周して12時で1.5秒停止)
[env:esp32_2424s012_railway]
extends = env:esp32_2424s012_blue
build_flags =
    ${env:esp32_2424s012_blue.build_flags}
    -DFACE_STYLE=1


; ======================================================================
;  ESP32 MiniKit (MH-ET LIVE)
;  配線: SDA=GPIO17, SCL=GPIO16, CS=GPIO22, DC=GPIO21, RST=GPIO27, BL=GPIO32
; ======================================================================
[env:mhetesp32minikit_blue]
platform = espressif32@6.9.0
board = mhetesp32minikit
framework = arduino

monitor_speed = 115200
monitor_filters = default, time

lib_deps =
    bodmer/TFT_eSPI@2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=17
    -DTFT_SCLK=16
    -DTFT_CS=22
    -DTFT_DC=21
    -DTFT_RST=27
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=27000000
    ; 色が赤と青で入れ替わる場合は有効化
    ; -DTFT_RGB_ORDER=TFT_BGR

; ESP32 MiniKit / 鉄道時計風の文字盤
[env:mhetesp32minikit_railway]
extends = env:mhetesp32minikit_blue
build_flags =
    ${env:mhetesp32minikit_blue.build_flags}
    -DFACE_STYLE=1
