; ======================================================================
;  アナログ時計 (GC9A01 240x240 円形ディスプレイ)
;
;  使う環境 (env):
;    supermini           ESP32-C3 Super Mini / 青い文字盤   ← 既定
;    supermini_railway   ESP32-C3 Super Mini / 鉄道時計風の文字盤
;    mhetesp32minikit    ESP32 MiniKit (MH-ET LIVE) / 青い文字盤
;    railway             ESP32 MiniKit (MH-ET LIVE) / 鉄道時計風の文字盤
;
;  注意: コメントは行頭の ";" で書く ("//" は使えない)
; ======================================================================

[platformio]
default_envs = supermini


; ======================================================================
;  ESP32-C3 Super Mini
;  配線: SDA=GPIO3, SCL=GPIO4, CS=GPIO1, DC=GPIO10, RST=GPIO0
;        VCC=3V3, GND=GND  (BL 端子は無いので接続不要)
; ======================================================================
[env:supermini]
; TFT_eSPI は ESP32-C3 + Arduino-ESP32 core 2.0.15 以降で tft.init() が
; Store access fault になるため、core 2.0.14 相当(platform 6.5.0)に固定する
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = default, time

lib_deps =
    bodmer/TFT_eSPI@2.5.43

; 速度優先の最適化(既定の -Os の代わりに -O2)
build_unflags = -Os
build_flags =
    -O2
    ; ネイティブUSB(CDC)経由で Serial を使う
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI 設定 ---
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=4
    -DTFT_CS=1
    -DTFT_DC=10
    -DTFT_RST=0
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    ; SPI クロック。画面が乱れる場合は 27000000 に下げる
    -DSPI_FREQUENCY=40000000
    ; platform 6.5.0 でも tft.init() でクラッシュする場合は有効化
    ; -DUSE_HSPI_PORT
    ; 色が赤と青で入れ替わる場合は有効化
    ; -DTFT_RGB_ORDER=TFT_BGR
    ; Super Mini は送信出力を下げないと WiFi が AUTH_EXPIRE で接続できない個体が多い
    -DWIFI_LOW_TX_POWER

; ESP32-C3 Super Mini / 鉄道時計風の文字盤
[env:supermini_railway]
extends = env:supermini
build_flags =
    ${env:supermini.build_flags}
    -DFACE_STYLE=1


; ======================================================================
;  ESP32 MiniKit (MH-ET LIVE)
;  配線: SDA=GPIO17, SCL=GPIO16, CS=GPIO22, DC=GPIO21, RST=GPIO27, BL=GPIO32
; ======================================================================
[env:mhetesp32minikit]
platform = espressif32@6.9.0
board = mhetesp32minikit
framework = arduino

monitor_speed = 115200
monitor_filters = default, time

lib_deps =
    bodmer/TFT_eSPI@2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=17
    -DTFT_SCLK=16
    -DTFT_CS=22
    -DTFT_DC=21
    -DTFT_RST=27
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=27000000
    ; 色が赤と青で入れ替わる場合は有効化
    ; -DTFT_RGB_ORDER=TFT_BGR

; ESP32 MiniKit / 鉄道時計風の文字盤
[env:railway]
extends = env:mhetesp32minikit
build_flags =
    ${env:mhetesp32minikit.build_flags}
    -DFACE_STYLE=1
